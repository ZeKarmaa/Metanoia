<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Points Tracker</title>\n</head>\n<body>\n    <h1>Points Tracker Application</h1>\n    <form id="pointsForm">\n        <label for="pointsInput">Enter Points:</label>\n        <input type="number" id="pointsInput" required/>\n        <button type="submit">Add Points</button>\n    </form>\n    <h2>Total Points: <span id="totalPoints">0</span></h2>\n    <script>\n        let totalPoints = 0;\n        const pointsForm = document.getElementById('pointsForm');\n        const totalPointsDisplay = document.getElementById('totalPoints');\n\n        pointsForm.addEventListener('submit', function(event) {\n            event.preventDefault();\n            const pointsInput = document.getElementById('pointsInput');\n            const points = parseInt(pointsInput.value, 10);\n            totalPoints += points;\n            totalPointsDisplay.innerText = totalPoints;\n            pointsInput.value = '';\n        });\n    <\/script>\n</body>\n</html>
